# inSVert simulation configuration

genome:
  ploidy: 2
  heterozygosity: 0.5

variants:
  INS:
    count: 100
    distribution: normal
    parameters:
      median_length: 500
      min_length: 50
      max_length: 5000
      sigma: 100

  DEL:
    count: 100
    distribution: pareto
    parameters:
      median_length: 500
      min_length: 50
      max_length: 5000

  DUP:
    count: 50
    distribution: normal
    parameters:
      median_length: 1000
      sigma: 100
      min_length: 100
      max_length: 10000
    copy_number:
      min: 2
      max: 5
      weights: [0.5, 0.3, 0.15, 0.05]

  INV:
    count: 50
    distribution: pareto
    parameters:
      median_length: 1000
      min_length: 100
      max_length: 10000

  TRA_COPY:
    count: 25
    distribution: normal
    reverse_ratio: 0.2
    parameters:
      median_length: 1000
      min_length: 100
      max_length: 10000
      sigma: 100

  TRA_CUT:
    count: 25
    distribution: normal
    reverse_ratio: 0.2
    parameters:
      median_length: 1000
      min_length: 100
      max_length: 10000
      sigma: 100

  SNP:
    count: 100
    tstv_ratio: 2.0

  MNP:
    count: 100
    tstv_ratio: 2.0
